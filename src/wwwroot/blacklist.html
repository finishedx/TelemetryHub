<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>黑名单管理 - TelegramMonitor</title>
  <link rel="stylesheet" href="/assets/panel.css?v=2" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">TelegramMonitor</div>
      <nav class="nav">
        <a class="nav-link" data-page="accounts" href="/dashboard.html">账号管理</a>
        <a class="nav-link" data-page="messages" href="/messages.html">消息查询</a>
        <a class="nav-link" data-page="keywords" href="/keywords.html">关键词设置</a>
        <a class="nav-link" data-page="blacklist" href="/blacklist.html">黑名单</a>
        <a class="nav-link" data-page="bot" href="/bot.html">Bot 通知</a>
      </nav>
      <div class="toolbar">
        <span id="currentUser" class="muted small"></span>
        <button id="btnLogout" class="btn danger small">退出登录</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>黑名单管理</h2>
      <p>管理通过 Bot 快捷按钮或排除规则屏蔽的用户和群组。停用后保留记录但不再拦截，删除后彻底解除屏蔽。</p>

      <div class="row three">
        <div class="field">
          <label for="accountId">监听账号</label>
          <select id="accountId">
            <option value="">全部账号</option>
          </select>
        </div>
        <div class="field">
          <label for="entryType">黑名单类型</label>
          <select id="entryType">
            <option value="">全部类型</option>
            <option value="User">屏蔽用户</option>
            <option value="Chat">屏蔽群组</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="btnRefresh" class="btn">刷新列表</button>
        </div>
      </div>
      <div id="blacklistStatus" class="status"></div>
    </section>

    <section class="card" style="margin-top:12px;">
      <div class="meta-row">
        <h2 style="margin:0;">黑名单列表</h2>
        <span id="blacklistCount" class="muted small">0 条</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>监听账号</th>
              <th>类型</th>
              <th>目标 ID / 用户</th>
              <th>名称</th>
              <th>状态</th>
              <th>创建时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="blacklistTbody">
            <tr><td colspan="8">暂无黑名单记录</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/common.js?v=2"></script>
  <script>
    const accountId = document.getElementById("accountId");
    const entryType = document.getElementById("entryType");
    const btnRefresh = document.getElementById("btnRefresh");
    const blacklistStatus = document.getElementById("blacklistStatus");
    const blacklistCount = document.getElementById("blacklistCount");
    const blacklistTbody = document.getElementById("blacklistTbody");

    let accountMap = new Map();

    function normalizeType(value) {
      if (typeof value === "string") return value;
      return Number(value) === 1 ? "Chat" : "User";
    }

    function accountLabel(id) {
      if (id === null || id === undefined || Number(id) <= 0) return "全局";
      return accountMap.get(Number(id)) || `账号 #${id}`;
    }

    function renderAccounts(accounts) {
      accountMap = new Map();
      const options = [
        '<option value="">全部账号</option>',
        '<option value="0">全局规则</option>'
      ];

      for (const account of Array.isArray(accounts) ? accounts : []) {
        const id = tm.toInt(tm.read(account, "id"), 0);
        const phone = tm.asText(tm.read(account, "phone"), "");
        const username = tm.asText(tm.read(account, "username"), "");
        const remark = tm.asText(tm.read(account, "remark"), "");
        const label = remark || username || phone || `账号 #${id}`;
        accountMap.set(id, `${label} (#${id})`);
        options.push(`<option value="${id}">${tm.esc(label)} (#${id})</option>`);
      }

      accountId.innerHTML = options.join("");
    }

    function renderRows(rows) {
      const list = Array.isArray(rows) ? rows : [];
      blacklistCount.textContent = `${list.length} 条`;

      if (list.length === 0) {
        blacklistTbody.innerHTML = '<tr><td colspan="8">暂无黑名单记录</td></tr>';
        return;
      }

      blacklistTbody.innerHTML = list.map(row => {
        const id = tm.toInt(tm.read(row, "id"), 0);
        const type = normalizeType(tm.read(row, "type"));
        const enabled = Boolean(tm.read(row, "isEnabled"));
        const typeText = type === "Chat" ? "群组" : "用户";
        const nextEnabled = enabled ? "false" : "true";
        const toggleText = enabled ? "停用" : "启用";

        return `
          <tr>
            <td>${id}</td>
            <td>${tm.esc(accountLabel(tm.read(row, "accountId")))}</td>
            <td><span class="badge">${typeText}</span></td>
            <td>${tm.esc(tm.asText(tm.read(row, "targetValue")))}</td>
            <td title="${tm.esc(tm.asText(tm.read(row, "displayName"), ""))}">${tm.esc(tm.shorten(tm.read(row, "displayName"), 45))}</td>
            <td>${enabled ? "已启用" : "已停用"}</td>
            <td>${tm.esc(tm.formatDateTime(tm.read(row, "createdAt")))}</td>
            <td>
              <div class="cell-actions">
                <button class="btn ghost small" data-action="toggle" data-id="${id}" data-enabled="${nextEnabled}">${toggleText}</button>
                <button class="btn danger small" data-action="delete" data-id="${id}" data-name="${tm.esc(tm.asText(tm.read(row, "displayName"), "该记录"))}">解除屏蔽</button>
              </div>
            </td>
          </tr>`;
      }).join("");
    }

    async function loadBlacklist(showStatus = false) {
      const params = new URLSearchParams();
      if (accountId.value !== "") params.set("accountId", accountId.value);
      if (entryType.value) params.set("type", entryType.value);
      const suffix = params.toString() ? `?${params.toString()}` : "";
      const rows = await tm.request(`/api/blacklist${suffix}`);
      renderRows(rows);
      if (showStatus) tm.setStatus(blacklistStatus, "黑名单列表已刷新", true);
    }

    btnRefresh.addEventListener("click", async () => {
      try {
        await loadBlacklist(true);
      } catch (error) {
        tm.setStatus(blacklistStatus, error instanceof Error ? error.message : "刷新失败", false);
      }
    });

    accountId.addEventListener("change", () => loadBlacklist().catch(error =>
      tm.setStatus(blacklistStatus, error instanceof Error ? error.message : "加载失败", false)));
    entryType.addEventListener("change", () => loadBlacklist().catch(error =>
      tm.setStatus(blacklistStatus, error instanceof Error ? error.message : "加载失败", false)));

    blacklistTbody.addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = Number(button.dataset.id);
      try {
        if (button.dataset.action === "toggle") {
          await tm.request(`/api/blacklist/${id}/toggle?enabled=${button.dataset.enabled}`, { method: "PUT" });
          tm.setStatus(blacklistStatus, "黑名单状态已更新", true);
        } else if (button.dataset.action === "delete") {
          if (!confirm(`确定解除屏蔽“${button.dataset.name}”吗？`)) return;
          await tm.request(`/api/blacklist/${id}`, { method: "DELETE" });
          tm.setStatus(blacklistStatus, "已解除屏蔽", true);
        }
        await loadBlacklist();
      } catch (error) {
        tm.setStatus(blacklistStatus, error instanceof Error ? error.message : "操作失败", false);
      }
    });

    (async function bootstrap() {
      const profile = await tm.ensureAuth();
      if (!profile) return;

      tm.fillCurrentUser(profile);
      tm.bindLogoutButton();
      tm.setCurrentNav("blacklist");

      try {
        const accounts = await tm.request("/api/accounts", { method: "GET" });
        renderAccounts(accounts);
        await loadBlacklist();
      } catch (error) {
        tm.setStatus(blacklistStatus, error instanceof Error ? error.message : "初始化失败", false);
      }
    })();
  </script>
</body>
</html>
